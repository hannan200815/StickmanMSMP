name: StickmanMoneySMP
version: 1.0.0
main: com.stickmoney.StickmanMoneySMP
api-version: '1.21'
description: Money, tiers, kill stealing and events for the MSMP server.
commands:
  msmp:
    description: Money SMP menu, balance, pay and admin commands
    usage: /msmp help
    aliases: [moneysmp]
  becometungtung:
    description: Become Tung Tung Sahur (admin only)
    usage: /becometungtung
    permission: stickmoney.admin
  becomeplayeragain:
    description: Stop being Tung Tung Sahur (admin only)
    usage: /becomeplayeragain
    permission: stickmoney.admin
permissions:
  stickmoney.admin:
    description: Manage money, tiers and events
    default: op
